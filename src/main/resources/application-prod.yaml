server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: ${LIQUIBASE_CHANGELOG:classpath:db/changelog/master.yaml}

logging:
  level:
    root: info
    org.springframework.security: warn

app:
  jwt:
    issuer: ${JWT_ISSUER}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
    secret: ${JWT_SECRET}